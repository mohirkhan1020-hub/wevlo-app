<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Wevlo Studio — Mobile Web &amp; App Builder</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-bg text-main antialiased selection:bg-violet-500/20">

  <div class="flex min-h-screen">
    <!-- Mobile Sidebar Drawer Overlay -->
    <div id="drawerOverlay" onclick="toggleDrawer(false)" class="fixed inset-0 bg-slate-950/50 backdrop-blur-sm z-40 hidden lg:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-50 h-screen w-72 surface-card border-r border-soft flex flex-col justify-between transform -translate-x-full lg:translate-x-0 transition-transform duration-300 rounded-none">
      <div class="overflow-y-auto px-4 py-5 space-y-5 flex-1">
        <!-- Brand Logo -->
        <div class="flex items-center justify-between px-2">
          <a href="#/" onclick="navigate('#/'); return false;" class="flex items-center gap-2 select-none group">
            <span class="w-9 h-9 rounded-xl icon-box-purple flex items-center justify-center shadow-md group-hover:scale-105 transition">
              <svg width="20" height="16" viewBox="0 0 36 28" fill="none">
                <path d="M3 5L10.5 22L18 9L25.5 22L33 5" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <div>
              <span class="text-lg font-extrabold tracking-tight block leading-none">Wevlo</span>
              <span class="text-[10px] font-semibold text-muted tracking-wider uppercase">Personal Studio</span>
            </div>
          </a>
          <button onclick="toggleDrawer(false)" class="lg:hidden p-1.5 rounded-xl text-muted hover:bg-violet-500/10">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- Dynamic Navigation Links -->
        <nav id="sidebarNav" class="space-y-1 text-[13px] font-medium"></nav>
      </div>

      <!-- Studio Footer Card -->
      <div class="p-4 border-t border-soft">
        <div class="hero-lavender rounded-2xl p-3.5 space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="flex items-center gap-2 font-bold text-xs">
              <span class="w-7 h-7 rounded-xl icon-box-purple flex items-center justify-center">
                <i data-lucide="cpu" class="w-3.5 h-3.5"></i>
              </span>
              Cloud APK Builder
            </span>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-600">READY</span>
          </div>
          <p class="text-[11px] text-muted leading-snug">
            Java, Kotlin, Flutter, Capacitor &amp; Python — all unlocked.
          </p>
          <button onclick="navigate('#/github-build'); toggleDrawer(false)" class="w-full btn-purple py-2 rounded-xl text-xs font-bold">
            Open GitHub IDE →
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 pb-24 lg:pb-8">
      <!-- Topbar Header -->
      <header class="sticky top-0 z-30 surface-glass border-b border-soft">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
          <div id="headerLeft" class="flex items-center gap-3"></div>

          <div class="flex items-center gap-2 relative">
            <button onclick="toggleTheme()" title="Toggle Light/Dark Theme" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-soft text-xs font-bold hover:bg-violet-500/10 transition">
              <i id="themeIcon" data-lucide="sun" class="w-4 h-4 text-violet-600"></i>
              <span id="themeLabel" class="hidden sm:inline">Light</span>
            </button>

            <button onclick="navigate('#/github-build')" title="GitHub Build Studio" class="p-2 rounded-full border border-soft text-muted hover:text-violet-600 hover:bg-violet-500/10 transition">
              <i data-lucide="github" class="w-4 h-4"></i>
            </button>

            <!-- User Profile Menu -->
            <button onclick="toggleAccountMenu()" class="flex items-center gap-1.5 focus:outline-none pl-1">
              <div class="relative">
                <div id="userAvatar" class="w-9 h-9 rounded-full btn-purple flex items-center justify-center font-bold text-sm">W</div>
                <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 border-2 border-white rounded-full"></span>
              </div>
              <i data-lucide="chevron-down" class="w-4 h-4 text-muted"></i>
            </button>

            <!-- Account Dropdown -->
            <div id="accountMenu" class="hidden absolute right-0 top-12 w-72 surface-card rounded-2xl shadow-2xl p-4 z-50 space-y-3">
              <div class="pb-3 border-b border-soft">
                <p id="accName" class="font-bold text-sm">Not Signed In</p>
                <p id="accEmail" class="text-xs text-muted truncate">Connect GitHub or Google</p>
              </div>
              <div class="space-y-2">
                <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-2 border border-soft hover:bg-violet-500/5 font-semibold text-xs py-2.5 rounded-xl transition">
                  <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.5 3.9-5.5 3.9-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.7 3.5 14.6 2.5 12 2.5 6.8 2.5 2.5 6.8 2.5 12s4.3 9.5 9.5 9.5c5.5 0 9.1-3.8 9.1-9.2 0-.6-.1-1.1-.2-1.6H12z" />
                  </svg>
                  Continue with Google
                </button>
                <button onclick="loginWithGithub()" class="w-full flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs py-2.5 rounded-xl transition">
                  <i data-lucide="github" class="w-4 h-4"></i>
                  <span id="ghMenuLabel">Connect GitHub Account</span>
                </button>
                <button onclick="navigate('#/settings'); toggleAccountMenu()" class="w-full text-center text-xs font-semibold text-violet-600 py-1">
                  Settings &amp; Profile
                </button>
                <button id="btnLogoutMenu" onclick="confirmLogout()" class="hidden w-full text-rose-600 hover:bg-rose-500/10 font-semibold text-xs py-2 rounded-xl transition">
                  Sign Out
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Dynamic View -->
      <main id="appContent" class="max-w-5xl w-full mx-auto px-4 py-5 space-y-5"></main>
    </div>
  </div>

  <!-- Mobile Floating Bottom Navigation -->
  <nav class="lg:hidden fixed bottom-3 left-4 right-4 z-30">
    <div class="surface-glass border border-soft shadow-[0_10px_35px_rgba(91,33,182,0.16)] rounded-[26px] px-2 py-2 grid grid-cols-4">
      <button onclick="navigate('#/')" data-bnav="#/" class="bnav-item flex flex-col items-center justify-center py-1 gap-0.5 text-slate-400">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[11px] font-semibold">Home</span>
        <span class="bnav-dot w-6 h-0.5 rounded-full bg-transparent mt-0.5"></span>
      </button>
      <button onclick="navigate('#/github-build')" data-bnav="#/github-build" class="bnav-item flex flex-col items-center justify-center py-1 gap-0.5 text-slate-400">
        <i data-lucide="github" class="w-5 h-5"></i>
        <span class="text-[11px] font-semibold">GitHub IDE</span>
        <span class="bnav-dot w-6 h-0.5 rounded-full bg-transparent mt-0.5"></span>
      </button>
      <button onclick="navigate('#/projects')" data-bnav="#/projects" class="bnav-item flex flex-col items-center justify-center py-1 gap-0.5 text-slate-400">
        <i data-lucide="folder" class="w-5 h-5"></i>
        <span class="text-[11px] font-semibold">Projects</span>
        <span class="bnav-dot w-6 h-0.5 rounded-full bg-transparent mt-0.5"></span>
      </button>
      <button onclick="navigate('#/settings')" data-bnav="#/settings" class="bnav-item flex flex-col items-center justify-center py-1 gap-0.5 text-slate-400">
        <i data-lucide="settings" class="w-5 h-5"></i>
        <span class="text-[11px] font-semibold">Settings</span>
        <span class="bnav-dot w-6 h-0.5 rounded-full bg-transparent mt-0.5"></span>
      </button>
    </div>
  </nav>

  <!-- New Project Modal -->
  <div id="newProjectModal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-slate-950/50 backdrop-blur-sm">
    <div class="surface-card w-full sm:max-w-md rounded-t-[28px] sm:rounded-[28px] p-6 space-y-4 shadow-2xl animate-slide-up">
      <div class="flex items-center justify-between">
        <h3 class="text-xl font-extrabold">New project</h3>
        <button onclick="closeNewProjectModal()" class="p-1.5 rounded-full hover:bg-violet-500/10 text-muted">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <input id="modalProjName" type="text" placeholder="Project name" class="w-full px-4 py-3.5 rounded-2xl border-2 border-violet-500/70 focus:outline-none focus:border-violet-600 text-sm font-medium bg-transparent" />
      <div class="space-y-2.5">
        <button type="button" onclick="selectModalType('html')" data-ptype="html" class="ptype-card active w-full text-left p-4 rounded-2xl border transition">
          <p class="font-bold text-sm">HTML page</p>
          <p class="text-xs text-muted">Single-page web project</p>
        </button>
        <button type="button" onclick="selectModalType('multifile')" data-ptype="multifile" class="ptype-card w-full text-left p-4 rounded-2xl border transition">
          <p class="font-bold text-sm">Multi file</p>
          <p class="text-xs text-muted">HTML, CSS, and JS files</p>
        </button>
        <button type="button" onclick="selectModalType('webview')" data-ptype="webview" class="ptype-card w-full text-left p-4 rounded-2xl border transition">
          <p class="font-bold text-sm">WebView app</p>
          <p class="text-xs text-muted">Website URL to Android APK</p>
        </button>
      </div>
      <button onclick="confirmCreateProject()" class="w-full btn-purple py-3.5 rounded-full font-bold text-sm">
        Create project
      </button>
    </div>
  </div>

  <!-- Confirmation Modal -->
  <div id="confirmModal" class="fixed inset-0 z-[55] hidden items-center justify-center bg-slate-950/50 backdrop-blur-sm p-4">
    <div class="surface-card w-full max-w-sm rounded-[24px] p-6 space-y-4 shadow-2xl animate-slide-up">
      <div class="flex items-center gap-3">
        <span class="w-10 h-10 rounded-full bg-rose-500/15 text-rose-600 flex items-center justify-center shrink-0">
          <i data-lucide="alert-triangle" class="w-5 h-5"></i>
        </span>
        <div>
          <h4 id="confirmTitle" class="font-extrabold text-base">Confirm Action</h4>
          <p id="confirmMsg" class="text-xs text-muted mt-0.5">Are you sure you want to proceed?</p>
        </div>
      </div>
      <div class="flex gap-2.5 justify-end pt-2">
        <button onclick="closeConfirmModal()" class="px-4 py-2 rounded-full border border-soft text-xs font-bold">Cancel</button>
        <button id="confirmOkBtn" class="px-5 py-2 rounded-full bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Guide Detail Modal -->
  <div id="guideModal" class="fixed inset-0 z-[55] hidden items-center justify-center bg-slate-950/50 backdrop-blur-sm p-4">
    <div class="surface-card w-full max-w-lg rounded-[26px] p-6 space-y-4 shadow-2xl animate-slide-up max-h-[85vh] overflow-y-auto">
      <div class="flex items-start justify-between gap-2">
        <div>
          <span id="guideCatBadge" class="text-[10px] font-bold bg-violet-100 text-violet-700 px-2.5 py-0.5 rounded-full">Guide</span>
          <h3 id="guideTitle" class="text-lg font-extrabold mt-1.5">Guide Title</h3>
        </div>
        <button onclick="document.getElementById('guideModal').classList.add('hidden'); document.getElementById('guideModal').classList.remove('flex')" class="p-1.5 rounded-full hover:bg-violet-500/10">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <p id="guideBody" class="text-xs leading-relaxed text-muted"></p>
      <div class="pt-2 flex justify-end">
        <button id="guideActionBtn" class="btn-purple px-5 py-2 rounded-full text-xs font-bold">Open Feature →</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-[60] hidden text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg"></div>

  <!-- App Entry Script -->
  <script type="module" src="app.js"></script>
</body>
</html>
